<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon rowerowy</title>
    <link rel="stylesheet" href="styl.css">
    <script src="skrypt.js" defer></script>
</head>
<body>

    <header>
        <img src="1.jpg" alt="rower">
        <img src="2.jpg" alt="rower">
        <img src="3.jpg" alt="rower">
        <img src="4.jpg" alt="rower">
        <img src="5.jpg" alt="rower">
    </header>

    <div class="flex">
        <main>
            <h1>Dobierz rozmiar ramy roweru do wzrostu</h1>
            <h2>Wybierz rodzaj roweru</h2>
            <input type="radio" name="bike" id="mountain" checked title="górski z kołami 29">
            <label for="mountain" class="klasa_etykiety">górski z kołami 29</label>
            <input type="radio" name="bike" id="road" title="szosa">
            <label for="road" class="klasa_etykiety ">szosa</label>
            <input type="radio" name="bike" id="trekking" title="trekking">
            <label for="trekking" class="klasa_etykiety ">trekking</label> <br>
            <h2>Podaj swój wzrost</h2>
            <input type="range" name="height-range" id="height-range" min="100" max="220" value="150">
            <input type="number" name="height-num" id="height-num" value="150">
            <button class="klasa_etykiety">Sprawdź</button>
            <p id="result">
                <!-- wynikiem działania skryptu 2  -->
            </p>
        </main>

        <aside>
            <h1>Polecane filmy</h1>
            <p class="logo1 right">cup</p>
            <p class="logo2">glass</p>
            <p class="logo1 mid">spoon</p>
            <p class="logo2 right">teaspoon</p>
            <p class="logo1">fork</p>
        </aside>
    </div>

    <footer class="flex">
        <section class="one">
            <h4>Oferowane typy rowerów</h4>
            <ul>
                <li>górskie
                    <ul>
                        <li>koła 29 cali</li>
                        <li>koła 26 cali</li>
                    </ul>
                </li>
                <li>szosowe</li>
                <li>miejskie</li>
            </ul>
        </section>

        <section class="two">
            <h4>Informacje</h4>
            <table>
                <tr>
                    <td>Autor:</td>
                    <td>00000000000</td>
                </tr>
                <tr>
                    <td>Aktualna data:</td>
                    <td id="date"></td>
                </tr>
            </table>
        </section>
    </footer>
    
</body>
</html>
