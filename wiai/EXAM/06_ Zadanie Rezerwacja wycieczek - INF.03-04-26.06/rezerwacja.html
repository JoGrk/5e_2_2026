<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biuro turystyczne</title>
    <link rel="stylesheet" href="styl.css">
    <script src="skrypt.js" defer></script>
</head>
<body>
    <header></header>

    <main>
        <nav>
            <button id="user">Uczestnik</button>
            <button id="reserve">Rezerwacja</button>
        </nav>

        <section class="first">
            <h2>Dane Klienta</h2>
            <img src="osoba.png" alt="Klient">
            <br>
            <label for="name">Imię</label>
            <input type="text" name="name" id="name">
            <br>
            <label for="lastName">Nazwisko</label>
            <input type="text" name="lastName" id="lastName">
            <p><a href="wycieczki.html">Do strony głównej</a></p>
        </section>

        <section class="second">
            <h2>Dane rezerwacji</h2>
            <span id="spanLeft">&laquo;</span>
            <img src="1.jpg" alt="wycieczka">
            <span id="spanRight">&raquo;</span>
            <h4>Barcelona</h4>
            <label for="people">Liczba osób:</label><br>
            <input type="number" name="people" id="people" min="1" max="4" value="2" disabled>
            <br>
            <label for="place">Miejsce wylotu</label>
            <select name="place" id="place" disabled>
                <option value="">Warszawa</option>
                <option value="">Kraków</option>
                <option value="">Wrocław</option>
            </select>
            <br>

            <input type="radio" name="food" id="breakfast" checked disabled>
            <label for="breakfast">Śniadanie</label>
            <input type="radio" name="food" id="breakfast-dinner" disabled
            <label for="breakfast-dinner">Śniadanie i  obiadokolacje</label>
            <input type="radio" name="food" id="all" disabled
            <label for="all">All inclusive</label>

            <button id="price">Sprawdź cenę</button>
        </section>

        <aside>
            <img src="1.jpg" alt="Wycieczki">
            <img src="2.jpg" alt="Wycieczki">
            <img src="3.jpg" alt="Wycieczki">
            <img src="1.jpg" alt="Wycieczki">
            <img src="2.jpg" alt="Wycieczki">
            <img src="3.jpg" alt="Wycieczki">
            <img src="1.jpg" alt="Wycieczki">
            <img src="2.jpg" alt="Wycieczki">
            <img src="3.jpg" alt="Wycieczki">
        </aside>
    </main>

    <footer>
        <p>Autor strony <em>0000000000</em></p>
    </footer>
</body>
</html>
